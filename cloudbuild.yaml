steps:
  # 1. کلون ریپو
  - name: 'gcr.io/cloud-builders/git'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        git clone https://github.com/suuenz/vprofile-project.git
        cd vprofile-project

  # 2. نصب Docker Compose
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose
        docker-compose --version

  # 3. بیلد ایمیج‌ها با Docker Compose
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pwd
        ls
        docker-compose build .

  # 4. تگ و پوش ایمیج‌ها به Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
      - push
      - 'gcr.io/${PROJECT_ID}/${_REPO}/vprofileapp:${_VERSION}'
      - 'gcr.io/{$PROJECT_ID}/${_REPO}/vprofileweb:${_VERSION}'
      - 'gcr.io/{$PROJECT_ID}/${_REPO}/vprofiledb:${_VERSION}'

substitutions:
  _PROJECT_ID: 'eighth-vehicle-466618-g2'
  _REPO: 'vprofile-images'
  _VERSION: 'v1.0'

options:
  logging: CLOUD_LOGGING_ONLY
