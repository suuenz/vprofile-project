apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofileapp
  labels:
    app: vprofileapp
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: vprofileapp
  template:
    metadata:
      labels:
        app: vprofileapp
    spec:
      containers:
        - name: vprofileapp
          image: 084317777937.dkr.ecr.eu-north-1.amazonaws.com/vprofileapp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: vprofileapp
  labels:
    app: vprofileapp
spec:
  type: LoadBalancer
  selector:
    app: vprofileapp
  ports:
    - name: http
      port: 80
      targetPort: 8080
