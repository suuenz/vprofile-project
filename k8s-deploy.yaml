apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofileapp
  labels:
    app: vprofileapp
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: vprofileapp
  template:
    metadata:
      labels:
        app: vprofileapp
    spec:
      containers:
        - name: vprofileapp
          image: 084317777937.dkr.ecr.eu-north-1.amazonaws.com/vprofileapp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # اگر برنامه‌ات بدون وابستگی‌ها (DB/Rabbit/Memcached) هم بالا می‌آید، همین کافیست.
          # در غیر اینصورت متغیرهای محیطی را باز کن و مقادیر مناسب بده.
          # env:
          #   - name: DB_HOST
          #     value: mysql
          #   - name: DB_USER
          #     valueFrom:
          #       secretKeyRef:
          #         name: mysql-secret
          #         key: username
          #   - name: DB_PASSWORD
          #     valueFrom:
          #       secretKeyRef:
          #         name: mysql-secret
          #         key: password
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      # اگر نودها دسترسی IAM/ECR دارند، نیاز به imagePullSecrets نیست.
      # در غیر اینصورت یک secret از نوع docker-registry بساز و اینجا اضافه کن:
      # imagePullSecrets:
      #   - name: ecr-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: vprofileapp
  labels:
    app: vprofileapp
spec:
  type: LoadBalancer
  selector:
    app: vprofileapp
  ports:
    - name: http
      port: 80
      targetPort: 8080
